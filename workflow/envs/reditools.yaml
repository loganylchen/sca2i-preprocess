name: sca2i-preprocess-reditools
channels:
  - bioconda
  - conda-forge
# REDItools2 (BioinfoUNIBA) ships as bare scripts, not a Python package, so
# we install only its runtime dependencies here and clone the repo at runtime
# in workflow/rules/refs.smk (rule clone_reditools2). reditools.smk invokes
# the resulting reditools.py via python.
dependencies:
  - python >=3.8,<3.11
  - pysam >=0.21
  - samtools >=1.18
  - htslib >=1.18
  - numpy
  - scipy
  - netifaces
  - psutil
  - sortedcontainers
  - git
