name: sca2i-preprocess-reditools
channels:
  - bioconda
  - conda-forge
# REDItools2 is not always packaged on bioconda. We pull it from GitHub via pip;
# bioconda may pick it up later — adjust here if so.
dependencies:
  - python >=3.8,<3.11
  - pysam >=0.21
  - samtools >=1.18
  - htslib >=1.18
  - numpy
  - scipy
  - pip
  - pip:
      - "git+https://github.com/BioinfoUNIBA/REDItools2.git@1e9d396f8aba058f073d7d27bf1148fe408adaf8"
