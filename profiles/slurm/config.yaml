# Snakemake 8.x SLURM profile.
#
# Requires the `snakemake-executor-plugin-slurm` plugin:
#   pip install snakemake-executor-plugin-slurm
#
# Then run:  `snakemake --profile profiles/slurm --jobs 200`
executor: slurm
jobs: 200
use-conda: true
keep-going: true
rerun-incomplete: true
printshellcmds: true
restart-times: 2
latency-wait: 60
default-resources:
  - mem_mb=4000
  - runtime=240
  - slurm_partition=batch
  - tmpdir="/tmp"
set-resources:
  reditools_10x:
    mem_mb: 16000
    runtime: 720
  reditools_ss:
    mem_mb: 8000
    runtime: 240
  umi_dedup:
    mem_mb: 12000
    runtime: 240
  split_bam_by_group:
    mem_mb: 8000
    runtime: 240
  aggregate_anndata:
    mem_mb: 32000
    runtime: 480
  filter_motif:
    mem_mb: 8000
    runtime: 120
  sort_ss:
    mem_mb: 16000
    runtime: 240
